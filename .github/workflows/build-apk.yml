name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_VER"
          
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17. Found: $JAVA_VER"
            exit 1
          fi
          
          echo "Java environment successfully verified with Java version: $JAVA_VER"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore could not be created or found."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ]; then
            echo "Debug APK verified successfully: $EXPECTED_APK"
          else
            echo "Error: Expected APK ($EXPECTED_APK) not found or is empty!"
            echo "Listing files found under app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(echo "$REPO_RAW" | awk -F'/' '{print $2}')
          
          # Sanitize repository name: replace non-alphanumeric/hyphen/underscore with hyphen, lowercase
          SAFE_REPO=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9_-]/-/g' -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          
          RELEASE_FILENAME="${SAFE_REPO}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "Error: Prepared release asset does not exist or is empty."
            exit 1
          fi
          
          echo "asset_path=${DEST_PATH}" >> $GITHUB_OUTPUT
          echo "asset_filename=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: $DEST_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH is missing or empty. Aborting release creation."
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          RELEASE_NOTES=$(cat <<EOF
          ### Debug APK Build #${{ github.run_number }}
          
          - **Build System:** Automatically generated by GitHub Actions
          - **Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Purpose:** Intended for testing and evaluation on Android devices
          - **Signing:** Signed only with a temporary debug keystore
          - **Notice:** This is an automated debug build and NOT a Play Store production release.
          EOF
          )
          
          echo "Creating GitHub Release with tag: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          
          echo "### 📱 Android Debug APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ APK compilation and artifact packaging succeeded" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name:** \`app-debug-apk\` (available under the workflow run Artifacts section)" >> $GITHUB_STEP_SUMMARY
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Publishing to GitHub Releases succeeded."
            echo "Retrieving release details with GitHub CLI..."
            gh release view "$TAG_NAME" || true
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Direct Asset Filename: $ASSET_FILENAME"
            
            echo "- **GitHub Release:** ✅ Published" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page:** [View Release and Download APK]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Asset:** \`$ASSET_FILENAME\` (download directly from the release Assets section)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "💡 *You can download the APK directly to your phone from the GitHub Release page or from the Actions artifacts section.*" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an issue. The APK build succeeded and the artifact 'app-debug-apk' is preserved."
            echo "- **GitHub Release:** ⚠️ Publishing encountered an issue or was skipped." >> $GITHUB_STEP_SUMMARY
            echo "- **Backup Download:** The compiled debug APK is safely preserved as the Actions artifact **\`app-debug-apk\`** on this workflow run page." >> $GITHUB_STEP_SUMMARY
          fi
